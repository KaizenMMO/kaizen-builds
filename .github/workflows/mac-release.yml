name: Mac release package

# Builds Kaizen for Apple Silicon Macs for a PUBLISHED release and attaches it
# to that same release, beside Kaizen-Setup.exe and the Linux tarball. Same
# shape as linux-release.yml.
#
# Started by the source repo's packaging/publish_release.py after each Windows
# publish. By hand:
#
#   gh workflow run mac-release.yml --repo KaizenMMO/kaizen-builds \
#     -f source_sha=<pushed commit in KaizenMMO/Kaizen> -f release_tag=v2.14
#
# What it leaves on the release:
#   Kaizen-Mac-AppleSilicon.dmg (+ .sha256) -- ONE FIXED NAME, so
#     releases/latest/download/Kaizen-Mac-AppleSilicon.dmg
#     is a permanent link to the newest Mac build (the app's "Copy Mac link"
#     button and README-MAC.txt both use it).
#   A "## Mac" section in the release notes, between markers.
#
# UNSIGNED PREVIEW: there is no Apple Developer account, so the app is signed
# ad-hoc only and players allow it once with "Open Anyway" (README-MAC.txt).
#
# Free: this repo is public, and public repos do not use Actions minutes
# (macOS runners included). macos-14 = Apple Silicon (arm64).

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact KaizenMMO/Kaizen commit (must be pushed)
        required: true
        type: string
      release_tag:
        description: Published release tag to attach to, e.g. v2.14
        required: true
        type: string
      run_tests:
        description: Run the full suite before building
        required: false
        default: true
        type: boolean
      tests_only:
        description: Stop after the tests (diagnosis; touches no release)
        required: false
        default: false
        type: boolean
      test_build:
        description: Tester build - attach only to a PRE-release tag; no notes
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: mac-release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 90
    defaults:
      run:
        working-directory: source
    env:
      QT_QPA_PLATFORM: offscreen
      USE_AUTO_UPDATE: "0"
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      STABLE_NAME: Kaizen-Mac-AppleSilicon.dmg
    steps:
      - name: Check out the source commit
        uses: actions/checkout@v4
        with:
          repository: KaizenMMO/Kaizen
          ref: ${{ inputs.source_sha }}
          # The same READ-ONLY deploy key linux-release.yml uses.
          ssh-key: ${{ secrets.KAIZEN_SOURCE_SSH_KEY }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source/requirements.txt
      - name: Install Tesseract
        run: |
          brew install tesseract
          tesseract --version | head -1
          tesseract --list-langs | grep -qx eng
      - name: Install Python dependencies
        # llama-cpp-python is COMPILED here (same pinned version, with Metal):
        # both of the project's prebuilt Apple Silicon wheels for 0.3.35 are
        # corrupt ("Bad CRC-32", checked 2026-11-05). The pip cache keeps the
        # built wheel, so later runs skip the compile.
        run: |
          grep -v '^llama-cpp-python' requirements.txt > "$RUNNER_TEMP/req-no-llama.txt"
          python -m pip install -r "$RUNNER_TEMP/req-no-llama.txt"
          llama=$(grep '^llama-cpp-python==' requirements.txt)
          CMAKE_ARGS="-DGGML_METAL=on" python -m pip install "$llama" \
            --no-binary llama-cpp-python
          python -c "import llama_cpp; print('llama_cpp', llama_cpp.__version__)"
          python -m pip install pytest==9.1.1 discord.py==2.7.1 \
            pyinstaller==6.22.0 nuitka==4.1.3
          python -c "import platform, cv2, PyQt5.QtCore; print(platform.machine(), 'cv2', cv2.__version__, 'Qt', PyQt5.QtCore.QT_VERSION_STR)"
      - name: Check the release matches this source
        run: |
          version=$(python -c "from src.version import __version__; print(__version__)")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [ "${{ inputs.tests_only }}" = "true" ]; then
            exit 0
          fi
          if [ "${{ inputs.test_build }}" = "true" ]; then
            pre=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease -q .isPrerelease)
            if [ "$pre" != "true" ]; then
              echo "::error::test builds attach only to a pre-release; $RELEASE_TAG is not one"
              exit 1
            fi
            exit 0
          fi
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::Source is v$version but the release tag is $RELEASE_TAG"
            exit 1
          fi
          state=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease -q '"\(.isDraft) \(.isPrerelease)"')
          if [ "$state" != "false false" ]; then
            echo "::error::$RELEASE_TAG must be a published, non-prerelease release (draft prerelease: $state)"
            exit 1
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qx Kaizen-Setup.exe \
            || { echo "::error::$RELEASE_TAG has no Kaizen-Setup.exe; publish the Windows build first"; exit 1; }
      - name: Test
        if: ${{ inputs.run_tests || inputs.tests_only }}
        # THIS LOG IS PUBLIC and the source is not: --tb=no prints each failure
        # as its test name and one-line reason, never the source lines a
        # traceback would quote. Reproduce a failure from the source repo.
        timeout-minutes: 35
        run: python -X faulthandler -m pytest -q --tb=no -rfE -p no:cacheprovider -o faulthandler_timeout=300
      - name: Build, sign ad-hoc and smoke-test the app
        if: ${{ !inputs.tests_only }}
        timeout-minutes: 50
        run: python packaging/build_mac.py
      - name: Package under the permanent name
        if: ${{ !inputs.tests_only }}
        run: |
          cd dist/release
          cp "Kaizen-$VERSION-Mac-arm64.dmg" "$STABLE_NAME"
          shasum -a 256 "$STABLE_NAME" > "$STABLE_NAME.sha256"
          cat "$STABLE_NAME.sha256"
          ls -l "$STABLE_NAME"
      - name: Attach to the release and verify the public download
        if: ${{ !inputs.tests_only }}
        timeout-minutes: 10
        run: |
          gh release upload "$RELEASE_TAG" "dist/release/$STABLE_NAME" "dist/release/$STABLE_NAME.sha256" \
            --clobber --repo "$GITHUB_REPOSITORY"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$STABLE_NAME"
          curl -fsSL -H 'Cache-Control: no-cache' "$url?verify=$(date +%s)" -o "$RUNNER_TEMP/public.dmg"
          cmp "$RUNNER_TEMP/public.dmg" "dist/release/$STABLE_NAME"
          echo "Public download verified: $url"
      - name: Add the Mac instructions to the release notes
        if: ${{ !inputs.tests_only && !inputs.test_build }}
        timeout-minutes: 5
        # Between markers, so a re-run REPLACES the section. The full
        # instructions are README-MAC.txt, inside the download itself.
        # The Linux and Mac workflows edit the SAME notes a few minutes apart;
        # a read-modify-write can drop the other's section, so each one checks
        # its own section survived and redoes the edit if not.
        run: |
          for attempt in 1 2 3 4; do
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > "$RUNNER_TEMP/body.md"
          python - "$RUNNER_TEMP/body.md" <<'PY'
          import re, sys
          path = sys.argv[1]
          body = open(path, encoding="utf-8").read()
          start, end = "<!-- mac-start -->", "<!-- mac-end -->"
          body = re.sub(re.escape(start) + r".*?" + re.escape(end), "", body, flags=re.S).rstrip()
          section = f"""{start}
          ## Mac (preview)

          **[Download for Mac (Apple Silicon)](https://github.com/KaizenMMO/kaizen-builds/releases/latest/download/Kaizen-Mac-AppleSilicon.dmg)**, always the newest version. M1 or newer, macOS 13 or later.

          1. Open the download and drag Kaizen onto Applications.
          2. The first time, macOS stops it: go to System Settings > Privacy & Security and press **Open Anyway** (Kaizen is not registered with Apple).
          3. Allow **Screen Recording** when asked, then open Kaizen again. If Tesseract is missing, Kaizen shows the Homebrew command with a Copy button.

          Full instructions and troubleshooting are in `README-MAC.txt` inside the download.
          {end}"""
          open(path, "w", encoding="utf-8").write(body + "\n\n" + section + "\n")
          PY
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/body.md"
          sleep 30
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body | grep -c "mac-start" | grep -qx 1; then
            exit 0
          fi
          echo "::warning::release notes lost the section (attempt $attempt); retrying"
          done
          echo "::error::could not keep the release-notes section"
          exit 1
      - name: Verify the permanent link
        if: ${{ !inputs.tests_only && !inputs.test_build }}
        timeout-minutes: 5
        run: |
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          if [ "$latest" = "$RELEASE_TAG" ]; then
            curl -fsSIL "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/$STABLE_NAME" | grep -i '^location' | tail -1
            echo "Permanent link serves $RELEASE_TAG"
          else
            echo "::warning::$RELEASE_TAG is not the latest release ($latest), so the permanent link does not serve it"
          fi
